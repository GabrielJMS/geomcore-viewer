[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geomcore-viewer"
version = "0.1.0"
description = "Live browser viewer client for geomcore (Babylon.js 3D + PixiJS 2D). Stdlib only."
readme = "../../README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["geomcore_viewer*"]
